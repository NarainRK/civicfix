services:
  backend1:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      PORT: "5000"
      INSTANCE_ID: backend1
    expose:
      - "5000"
    restart: unless-stopped

  backend2:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      PORT: "5000"
      INSTANCE_ID: backend2
    expose:
      - "5000"
    restart: unless-stopped

  backend3:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      PORT: "5000"
      INSTANCE_ID: backend3
    expose:
      - "5000"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3
    restart: unless-stopped
